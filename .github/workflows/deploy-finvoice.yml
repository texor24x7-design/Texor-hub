name: Deploy Texor Finvoice

on:
  push:
    branches:
      - main
    paths:
      - "texor-finvoice/**"
      - ".github/workflows/deploy-finvoice.yml"

concurrency:
  group: texor-ec2-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Finvoice Backend to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          passphrase: ${{ secrets.EC2_SSH_PASSPHRASE }}
          command_timeout: 30m

          script: |
            set -e

            echo "==> Starting Texor Finvoice backend deployment"

            cd ~/Texor-hub

            echo "==> Fetching latest code"
            git fetch origin main

            echo "==> Checking out deployed commit"
            git checkout --detach ${{ github.sha }}

            echo "==> Loading Node.js"
            export NVM_DIR="$HOME/.nvm"
            source "$NVM_DIR/nvm.sh"
            nvm use 24.21.0

            echo "==> Node version"
            node --version

            echo "==> npm version"
            npm --version

            echo "==> Installing backend dependencies"
            cd texor-finvoice/backend
            npm ci

            # npm no longer runs a dependency's install scripts unless they are
            # approved, so Puppeteer's postinstall never fetches Chromium and
            # every PDF — invoices, emailed copies — fails with a 503. Asking for
            # the browser directly does not depend on that policy, and it skips
            # the download when the cache already has it.
            echo "==> Ensuring the PDF renderer has its browser"
            npx --yes puppeteer browsers install chrome

            echo "==> Running Finvoice tests"
            NODE_ENV=test npm test

            echo "==> Restarting Finvoice backend"
            pm2 restart texor-finvoice --update-env

            echo "==> PM2 status after restart"
            pm2 status

            echo "==> Waiting for Finvoice API"

            for i in {1..30}; do
              if curl --fail --silent --show-error \
                http://127.0.0.1:4001/api/health; then

                echo ""
                echo "==> Finvoice API is healthy"
                break
              fi

              if [ "$i" -eq 30 ]; then
                echo ""
                echo "==> Finvoice API failed to become healthy"
                echo "==> Last 50 Finvoice log lines:"
                pm2 logs texor-finvoice --lines 50 --nostream
                exit 1
              fi

              echo "Waiting for Finvoice... attempt $i/30"
              sleep 2
            done

            echo ""
            echo "==> Texor Finvoice backend deployment successful"